RESUME_SECTION_HIGHLIGHT:
  highlight: one highlight
  relevance: relevance of the bullet point

RESUME_SECTION_HIGHLIGHTER_OUTPUT:
  final_answer: Ranked resume highlights in the requested structured format.

RESUME_SECTION_BATCH_ITEM:
  section_id: The source section identifier, such as experience:0 or project:1.
  highlights: Ranked rewritten highlights for that section in the requested structured format.

RESUME_SECTION_BATCH_HIGHLIGHTER_OUTPUT:
  final_answer: Batched ranked resume highlights grouped by section_id.

RESUME_SKILLS:
  technical_skills: A dictionary where each key is a technical skill subcategory (e.g., "Languages & Frameworks", "Cloud & DevOps") and the value is a list of relevant skills under that group.
  non_technical_skills: An itemized list of non-technical skills (simple list, not nested)

RESUME_SKILLS_MATCHER_OUTPUT:
  final_answer: Deduplicated skills in the requested structured format.

RESUME_OBJECTIVE_OUTPUT:
  final_answer: A factual, role-targeted professional summary.

RESUME_EVIDENCE_PLAN_OUTPUT:
  final_answer: Candidate-supported requirement matches with source IDs, safe keywords, match strength, and gaps.

JOB_DESCRIPTION:
  company: >
    Name of the company that has the job opening
  location: >
    Location of the job posting. It can be city, country or can be both. Also look for Remote. Location should be null if not known.
  job_type: >
    Type of the job, which can be On site or Hybrid or Remote. Should return null if not known.
  job_title: >
    Job title
  team: Name of the team within the company. Team name should be null if it's not known.
  job_summary: >
    Brief summary of the job, not exceeding 100 words
  salary: >
    Salary amount or range. Salary should be null if it's not known.
  duties: >
    The role, responsibilities and duties of the job as an itemized list, not exceeding 500 words
  qualifications: The qualifications, skills, and experience required for the job as an itemized list, not exceeding 500 words
  ats_keywords: >
    Keywords that may be triggered by Applicant Tracking Systems (ATS), such as: Python, Cloud Computing, Agile, Data analytics, product management, cross-function collaboration, etc...
  is_fully_remote: >
    Does the job have an option to work fully (100%) remotely? Hybrid or partial remote is marked as `False`. Use `None` if the answer is not known.
  technical_skills: >
    An itemized list of technical skills, including programming languages, technologies, and tools.
  non_technical_skills: >
    An itemized list of non-technical Soft skills.
